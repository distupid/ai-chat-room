<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>AI-Chat-Room</title>
  <style>
    /* Material Design 3 色彩令牌（基线紫色主题） */
    :root, [data-theme="light"] {
      --primary: #6750A4; --on-primary: #FFFFFF; --primary-container: #EADDFF; --on-primary-container: #21005D;
      --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
      --tertiary: #7D5260; --tertiary-container: #FFD8E4;
      --surface: #FEF7FF; --surface-dim: #DED8E1;
      --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
      --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9;
      --on-surface: #1D1B20; --on-surface-variant: #49454F; --outline: #79747E; --outline-variant: #CAC4D0;
      --error: #B3261E; --on-error: #FFFFFF; --error-container: #F9DEDC; --on-error-container: #410E0B;
      --inverse-surface: #322F35; --inverse-on-surface: #F5EFF7; --inverse-primary: #D0BCFF;
      --scrim: rgba(0,0,0,.32);
      --st-generating: #0B57D0; --st-generating-bg: #D3E3FD;
      --st-limit: #8A5300; --st-limit-bg: #FFDDB3;
      --st-error: #B3261E; --st-error-bg: #F9DEDC;
      --st-idle: #146C2E; --st-idle-bg: #C4EED0;
      --st-closed: #49454F; --st-closed-bg: #E6E0E9;
      --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
      --elev-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
    }
    [data-theme="light"] { color-scheme: light; }
    [data-theme="dark"] {
      color-scheme: dark;
      --primary: #D0BCFF; --on-primary: #381E72; --primary-container: #4F378B; --on-primary-container: #EADDFF;
      --secondary-container: #4A4458; --on-secondary-container: #E8DEF8;
      --tertiary: #EFB8C8; --tertiary-container: #633B48;
      --surface: #141218; --surface-dim: #141218;
      --surface-container-lowest: #0F0D13; --surface-container-low: #1D1B20; --surface-container: #211F26;
      --surface-container-high: #2B2930; --surface-container-highest: #36343B;
      --on-surface: #E6E0E9; --on-surface-variant: #CAC4D0; --outline: #938F99; --outline-variant: #49454F;
      --error: #F2B8B5; --on-error: #601410; --error-container: #8C1D18; --on-error-container: #F9DEDC;
      --inverse-surface: #E6E0E9; --inverse-on-surface: #322F35; --inverse-primary: #6750A4;
      --scrim: rgba(0,0,0,.5);
      --st-generating: #A8C7FA; --st-generating-bg: #0842A0;
      --st-limit: #FFB95C; --st-limit-bg: #5C3B00;
      --st-error: #F2B8B5; --st-error-bg: #8C1D18;
      --st-idle: #6DD58C; --st-idle-bg: #0F5223;
      --st-closed: #CAC4D0; --st-closed-bg: #36343B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--surface); color: var(--on-surface); }
    body { font: 14px/20px Roboto, "Noto Sans SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; letter-spacing: .1px; }
    button, input, textarea, select { font: inherit; color: inherit; }
    svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; }
    svg.i.s18 { width: 18px; height: 18px; }
    svg.i.s22 { width: 22px; height: 22px; }

    /* 顶部应用栏 */
    .appbar { position: sticky; top: 0; z-index: 10; background: var(--surface-container); display: flex; align-items: center; gap: 8px; padding: 8px 16px; min-height: 64px; }
    .appbar h1 { font-size: 22px; line-height: 28px; font-weight: 400; margin: 0 12px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .appbar .grow { flex: 1; }
    .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--on-surface-variant); font-size: 12px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--outline); }
    .dot.on { background: var(--st-idle); } .dot.off { background: var(--error); }
    /* 滚动条跟随主题 */
    * { scrollbar-color: var(--outline) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--on-surface-variant) 40%, transparent); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--on-surface-variant); }
    /* 搜索：平时只显示图标，点击展开；高度与旁边的图标按钮一致（40px） */
    .search { display: flex; align-items: center; gap: 4px; height: 40px; width: 40px; padding: 0; border-radius: 20px; background: transparent; color: var(--on-surface-variant); overflow: hidden; transition: width .2s, background .2s; flex: none; }
    .search .sbtn { flex: none; }
    .search input { width: 0; padding: 0; }
    .search.open { width: min(360px, 50vw); background: var(--surface-container-high); padding-right: 12px; }
    .search.open input { width: auto; }
    .search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; color: var(--on-surface); }

    .icon-btn { width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--on-surface-variant); position: relative; flex: none; }
    .icon-btn:hover { background: color-mix(in srgb, var(--on-surface-variant) 8%, transparent); }
    .icon-btn:focus-visible { outline: 2px solid var(--primary); }
    .icon-btn.on { color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent); }

    .btn { height: 40px; padding: 0 24px; border-radius: 20px; border: 0; cursor: pointer; font-weight: 500; letter-spacing: .1px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .btn.s { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; }
    .btn:disabled { opacity: .38; cursor: default; }
    .btn.filled { background: var(--primary); color: var(--on-primary); }
    .btn.filled:hover:not(:disabled) { box-shadow: var(--elev-1); }
    .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn.tonal:hover:not(:disabled) { box-shadow: var(--elev-1); }
    .btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
    .btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
    .btn.outlined:hover:not(:disabled), .btn.text:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 8%, transparent); }
    .btn.text.danger { color: var(--error, #b3261e); }
    .btn.text.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--error, #b3261e) 8%, transparent); }

    /* 筛选芯片 */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 24px 4px; align-items: center; }
    .chip { height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline-variant); background: transparent; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--on-surface-variant); }
    .chip:hover { background: color-mix(in srgb, var(--on-surface-variant) 8%, transparent); }
    .chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
    .chip .n { font-size: 12px; opacity: .8; }
    .chips .sep { width: 1px; height: 24px; background: var(--outline-variant); margin: 0 4px; }
    .chips .cg { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    main { padding: 12px 24px 96px; }
    /* align-items:start：展开回复栏只让这一张卡片变高，不拉伸同一行的其他卡片 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--on-surface-variant); padding: 64px 16px; }

    /* 会话卡片（filled card，可点击） */
    .card { background: var(--surface-container-low); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; outline: none; transition: box-shadow .15s, background .15s; }
    /* 卡片统一高度：默认固定高度，内容超出截断（标题/预览已有省略，按钮靠 margin-top:auto 沉底对齐） */
    .card { --card-h: 220px; height: var(--card-h); overflow: hidden; }
    /* 展开卡片内快速回复时，随内容增高（不截断输入框） */
    .card:has(.creply) { height: auto; min-height: var(--card-h); }
    /* 双向绑定：浏览器窗口里正显示着这个会话 */
    .card.active-page { box-shadow: 0 0 0 2px var(--primary); }
    .card:hover { box-shadow: var(--elev-1); background: var(--surface-container); }
    .card.active-page:hover { box-shadow: 0 0 0 2px var(--primary), var(--elev-1); }
    .card:focus-visible { outline: 2px solid var(--primary); }
    /* 卡片底色 = 网站主题色淡染（一眼可区分，整体协调）；所有状态统一；页面已关更淡 */
    .card { --src: var(--primary); background: color-mix(in srgb, var(--src) 13%, var(--surface-container-low)); }
    .card.src-chatgpt { --src: #0FA37E; } .card.src-duckai { --src: #E0622D; } .card.src-hark { --src: #5B7CFF; }
    .card:hover { background: color-mix(in srgb, var(--src) 19%, var(--surface-container)); }
    .card.s-closed { background: color-mix(in srgb, var(--src) 6%, var(--surface-container-low)); }
    .card .head { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { width: 40px; height: 40px; border-radius: 20px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; }
    .avatar.chatgpt { background: #0FA37E; color: #fff; }
    .avatar.duckai { background: #E0622D; color: #fff; }
    .avatar.hark { background: #5B7CFF; color: #fff; }
    .avatar.other { background: var(--src, var(--tertiary-container)); color: #fff; }
    /* 详情头部的小头像：跟卡片头像同一样式，只是更小 */
    .avatar.mini { width: 20px; height: 20px; border-radius: 10px; font-size: 11px; }
    .dsub .dsrc { display: inline-flex; align-items: center; gap: 6px; }

    /* 转发弹窗：站点 / 会话列表 */
    .fwlist { display: flex; flex-direction: column; gap: 4px; }
    .fwlist .fwitem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; text-align: left; font-size: 14px; color: var(--on-surface); }
    .fwlist .fwitem:hover { background: var(--surface-container); }
    .fwlist .fwitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fwlist .fwitem small { color: var(--on-surface-variant); font-size: 12px; }
    .fwlist .fwback { align-self: flex-start; margin-bottom: 4px; }
    .card .tt { flex: 1; min-width: 0; }
    .card .title { font-size: 16px; line-height: 24px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px; min-width: 0; }
    .card .title .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .card .title svg { flex: none; color: var(--primary); }
    .card .sub { color: var(--on-surface-variant); font-size: 12px; line-height: 16px; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .b-generating { background: var(--st-generating-bg); color: var(--st-generating); }
    .b-limit_reached { background: var(--st-error-bg); color: var(--st-error); }
    .b-error { background: var(--st-error-bg); color: var(--st-error); }
    .b-idle { background: var(--st-idle-bg); color: var(--st-idle); }
    .b-closed { background: var(--st-closed-bg); color: var(--st-closed); }
    .b-opening { background: var(--st-closed-bg); color: var(--primary); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--outline-variant); font-size: 11px; display: inline-flex; align-items: center; color: var(--on-surface-variant); }
    .tag.warn { border-color: var(--error); color: var(--error); }
    .preview { font-size: 13px; color: var(--on-surface-variant); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; white-space: pre-wrap; word-break: break-word; }
    .preview b { color: var(--on-surface); font-weight: 500; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .card .actions { margin-top: auto; padding-top: 4px; flex-wrap: nowrap; gap: 6px; }
    /* 卡片按钮平时隐藏，滑过（或键盘聚焦到卡片内）时显示；展开了快速回复时保持显示 */
    .card .actions { opacity: 0; visibility: hidden; transition: opacity .15s, visibility .15s; }
    .card:hover .actions, .card:focus-within .actions, .card:has(.creply) .actions { opacity: 1; visibility: visible; }
    /* 四个按钮保持同一行：平分宽度，文字放不下时省略 */
    .card .actions .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; justify-content: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    /* 卡片：向下弹出的快速回复栏 */
    .creply { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; cursor: default; }
    .creply .field { min-height: 56px; background: var(--surface-container-lowest); }
    .creply .qr { display: flex; gap: 6px; flex-wrap: wrap; }
    .creply .qr button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); font-size: 12px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .creply .qr button:hover { background: var(--secondary-container); color: var(--on-secondary-container); }
    .creply .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
    .creply .hint { margin-right: auto; font-size: 12px; color: var(--on-surface-variant); }
    .msg.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--primary); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .card .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
    .card .side-top { display: flex; align-items: center; gap: 2px; }
    /* 页面已关卡片的删除按钮：macOS 红色关闭按钮样式，悬停卡片时显示 × */
    .card .card-del { all: unset; box-sizing: border-box; width: 14px; height: 14px; margin-left: 6px; border-radius: 50%; cursor: pointer;
      display: inline-grid; place-items: center; background: #ff5f57; border: 0.5px solid #e0443e; color: transparent;
      box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.25); transition: transform .12s ease, filter .12s ease, color .12s ease; }
    .card .card-del svg { width: 8px; height: 8px; display: block; }
    .card:hover .card-del, .card .card-del:focus-visible { color: #7d1712; }
    .card .card-del:hover { filter: brightness(1.05); transform: scale(1.12); }
    .card .card-del:active { filter: brightness(0.85); transform: scale(0.95); }
    .card .card-del:focus-visible { outline: 2px solid color-mix(in srgb, #ff5f57 45%, transparent); outline-offset: 2px; }
    .card .side .time { font-size: 12px; line-height: 16px; color: var(--on-surface-variant); white-space: nowrap; }
    .field { border: 1px solid var(--outline); border-radius: 4px; background: transparent; padding: 10px 12px; width: 100%; resize: vertical; min-height: 64px; outline: none; }
    .field:focus { border: 2px solid var(--primary); padding: 9px 11px; }

    .msg .body img.rich { display: block; max-width: 100%; max-height: 480px; border-radius: 8px; margin: 8px 0; cursor: zoom-in; }
    .msg .body a.dl { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; margin: 4px 0; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--primary); text-decoration: none; font-size: 13px; }
    .msg .body a.dl:hover { background: var(--secondary-container); }
    .msg .body a.dl svg { width: 18px; height: 18px; fill: currentColor; }
    /* 富文本（原页面格式）：代码块、图片、文件、表格、标题、列表 */
    .msg .body.rich p { white-space: normal; }
    .msg .body.rich h1, .msg .body.rich h2, .msg .body.rich h3, .msg .body.rich h4, .msg .body.rich h5, .msg .body.rich h6 { margin: 12px 0 6px; line-height: 1.35; font-weight: 600; }
    .msg .body.rich h1 { font-size: 20px; } .msg .body.rich h2 { font-size: 18px; } .msg .body.rich h3 { font-size: 16px; }
    .msg .body.rich h4, .msg .body.rich h5, .msg .body.rich h6 { font-size: 14px; }
    .msg .body.rich ul, .msg .body.rich ol { margin: 4px 0 8px; padding-left: 22px; }
    .msg .body.rich li { margin: 2px 0; }
    .msg .body.rich li > p { margin: 0; }
    .msg .body.rich blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--outline-variant); color: var(--on-surface-variant); }
    .msg .body.rich hr { border: 0; border-top: 1px solid var(--outline-variant); margin: 12px 0; }
    .msg .body.rich a:not(.filechip):not(.imgdl) { color: var(--primary); }
    .msg .body .tablewrap { overflow-x: auto; margin: 8px 0; }
    .msg .body table { border-collapse: collapse; font-size: 13px; }
    .msg .body th, .msg .body td { border: 1px solid var(--outline-variant); padding: 4px 8px; text-align: left; vertical-align: top; }
    .msg .body th { background: var(--surface-container-highest); font-weight: 600; }
    .msg .body .codeblock { margin: 8px 0; border-radius: 8px; overflow: hidden; background: var(--surface-container-highest); }
    .msg .body .codeblock pre { margin: 0; border-radius: 0; }
    .msg .body .codeblock .cbh { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 12px; font-size: 12px; color: var(--on-surface-variant); border-bottom: 1px solid var(--outline-variant); }
    .msg .body .codeblock .lang { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; }
    .msg .body .codeblock .cbtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: 14px; background: transparent; color: var(--primary); cursor: pointer; font-size: 12px; }
    .msg .body .codeblock .cbtn:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .msg .body .codeblock .cbtn .ic, .msg .body .filechip .ic, .msg .body a.imgdl .ic { display: inline-flex; }
    .msg .body .codeblock .cbtn svg { width: 16px; height: 16px; fill: currentColor; }
    .msg .body .imgblock { display: inline-flex; flex-direction: column; align-items: flex-start; max-width: 100%; margin: 4px 0; vertical-align: top; }
    .msg .body .imgblock img.rich { margin: 4px 0; }
    .msg .body a.imgdl { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--outline-variant); color: var(--primary); text-decoration: none; font-size: 12px; }
    .msg .body a.imgdl:hover { background: var(--secondary-container); }
    .msg .body a.imgdl svg { width: 16px; height: 16px; fill: currentColor; }
    .msg .body .filechip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 34px; padding: 0 10px; margin: 4px 4px 4px 0; border-radius: 8px; border: 1px solid var(--outline-variant); background: var(--surface-container-low); color: var(--on-surface); text-decoration: none; font-size: 13px; vertical-align: middle; }
    .msg .body a.filechip { color: var(--primary); }
    .msg .body a.filechip:hover { background: var(--secondary-container); }
    .msg .body .filechip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .msg .body .filechip svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
    .msg .body .filechip.nolink { color: var(--on-surface-variant); cursor: default; }

    /* 详情：快速回复 */
    .composer { display: none; flex-direction: column; gap: 8px; padding: 12px 24px 20px; border-top: 1px solid var(--outline-variant); position: relative; }
    .composer.open { display: flex; }
    .composer .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
    /* 输入框 + 发送按钮同一行；附件按钮定位在输入框内部右下角 */
    .composer .qrow { display: flex; gap: 10px; align-items: center; }
    .composer .qwrap { position: relative; flex: 1; min-width: 0; display: flex; }
    .composer .qwrap .field { flex: 1; min-width: 0; padding-right: 40px; }
    .composer .qwrap .attach { position: absolute; right: 4px; bottom: 4px; }
    /* 发送按钮：加大尺寸，胶囊形，跟输入框垂直居中 */
    #quickSend { flex: none; height: 44px; padding: 0 22px; border-radius: 22px; font-size: 14px; font-weight: 500; letter-spacing: .5px; box-shadow: var(--elev-1); transition: transform .12s, box-shadow .12s; }
    #quickSend:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--elev-2); }
    #quickSend:active:not(:disabled) { transform: translateY(0); }
    .composer .attach { width: 36px; height: 36px; border-radius: 18px; margin-left: -6px; }
    .composer .attach:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
    .composer .attach svg { width: 20px; height: 20px; }
    .composer.dragging .field { outline: 2px dashed var(--primary); outline-offset: 2px; }
    .qfiles { display: none; flex-wrap: wrap; gap: 8px; }
    .qfiles.has { display: flex; }
    .qfile { position: relative; display: flex; align-items: center; gap: 8px; max-width: 260px; padding: 6px 4px 6px 10px; border-radius: 12px; background: var(--surface-container-high); font-size: 13px; overflow: hidden; }
    .qfile .ft { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary-container); color: var(--on-primary-container); font-size: 10px; font-weight: 700; flex: none; text-transform: uppercase; overflow: hidden; }
    .qfile .ft img { width: 100%; height: 100%; object-fit: cover; }
    .qfile .fn { display: flex; flex-direction: column; min-width: 0; }
    .qfile .fn b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qfile .fn small { color: var(--on-surface-variant); font-size: 11px; }
    .qfile.err { background: var(--error-container); color: var(--on-error-container); }
    .qfile.err .fn small { color: inherit; }
    .qfile .icon-btn { width: 28px; height: 28px; }
    .qfile .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--primary); transition: width .2s; }
    .composer .hint { margin-right: auto; font-size: 12px; color: var(--on-surface-variant); }
    /* 常见回答：跟卡片内快速回复 (.creply .qr) 一样的 chip 样式 */
    .cands { display: none; gap: 6px; flex-wrap: wrap; }
    .cands.open { display: flex; }
    .cands .cand { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); font-size: 12px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cands .cand:hover, .cands .cand.on { background: var(--secondary-container); color: var(--on-secondary-container); }

    /* 底部群发栏：muse.ai composer 风格——大圆角、毛玻璃底、textarea 自适应高度 */
    .bcastbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; width: min(760px, calc(100% - 32px)); z-index: 20; }
    .bcastbox { position: relative; border-radius: 26px; padding: 14px 16px 52px;
      background: color-mix(in srgb, var(--surface-container-high) 82%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--outline-variant); box-shadow: var(--elev-2); }
    .bcastbox .qfiles.has { margin-bottom: 8px; }
    #bcastText { width: 100%; border: 0; background: transparent; resize: none; overflow-y: auto;
      font: inherit; color: var(--on-surface); max-height: 180px; padding: 0; }
    #bcastText:focus { outline: none; }
    .bcastbox .attach { position: absolute; left: 12px; bottom: 8px; width: 36px; height: 36px; border-radius: 18px; }
    .bcastbox .attach:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
    #bcastSend { position: absolute; right: 12px; bottom: 10px; height: 36px; padding: 0 20px; border-radius: 18px; font-weight: 500; }
    main { padding-bottom: 110px; }   /* 给群发栏留位置 */

    /* 群发结果卡片：每个 AI 一块，带头像、名称、对话框 */
    .bcast-results { display: flex; flex-direction: column; gap: 12px; }
    .bcast-item { border: 1px solid var(--outline-variant); border-radius: 16px; overflow: hidden; }
    .bcast-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: color-mix(in srgb, var(--src, var(--primary)) 10%, var(--surface-container-low)); }
    .bcast-head .nm { font-weight: 500; flex: 1; }
    .bcast-head .st { font-size: 12px; color: var(--on-surface-variant); }
    .bcast-body { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.6; }
    .bcast-body.waiting { color: var(--on-surface-variant); font-size: 13px; }

    /* 对话框 */
    .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: none; align-items: center; justify-content: center; padding: 24px; }
    .scrim.open { display: flex; }
    .dialog { background: var(--surface-container-high); border-radius: 28px; box-shadow: var(--elev-3); width: min(860px, 100%); max-height: min(88vh, 100%); display: flex; flex-direction: column; overflow: hidden; }
    .dialog.narrow { width: min(560px, 100%); }
    .dialog .dh { display: flex; align-items: center; gap: 8px; padding: 20px 16px 12px 24px; }
    .dialog .dh h2 { font-size: 22px; line-height: 28px; font-weight: 400; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dialog .dsub { padding: 0 24px 12px; color: var(--on-surface-variant); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* 详情头部增加一条分割线 */
    #detailSub { border-bottom: 1px solid var(--outline-variant); }
    .dialog .db { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 24px; }
    .dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px 20px; }

    /* 详情：消息 */
    .msgs { display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 92%; border-radius: 16px; padding: 10px 14px; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--primary-container); color: var(--on-primary-container); border-bottom-right-radius: 4px; }
    .msg.assistant, .msg.unknown, .msg.system, .msg.tool { align-self: flex-start; background: var(--surface-container-lowest); border: 1px solid var(--outline-variant); border-bottom-left-radius: 4px; }
    .msg.streaming { border-color: var(--st-generating); }
    .msg .meta { font-size: 11px; color: var(--on-surface-variant); display: flex; gap: 8px; margin-bottom: 4px; }
    .msg.user .meta { color: inherit; opacity: .75; }
    .msg .body p { margin: 0 0 8px; white-space: pre-wrap; }
    .msg .body p:last-child { margin-bottom: 0; }
    .msg .body pre { margin: 8px 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-container-highest); overflow-x: auto; font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; }
    .msg .body code.inl { font: 12.5px ui-monospace, Consolas, monospace; background: var(--surface-container-highest); border-radius: 4px; padding: 1px 4px; }
    .msg.collapsed .body { display: none; }
    /* 超长消息：首尾各 1/4 弹窗高度，中间折叠 */
    .msg .longfold .lhead, .msg .longfold .ltail { overflow: hidden; position: relative; }
    .msg .longfold .lhead { -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
    .msg .longfold .ltail { display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(transparent, #000 25%); mask-image: linear-gradient(transparent, #000 25%); }
    .msg .longfold .ltail > .body { flex: none; }
    .msg .longbtn { display: block; width: 100%; margin: 6px 0; padding: 6px 0; border: 1px dashed var(--outline-variant); border-radius: 8px; background: transparent; color: var(--primary); font: inherit; font-size: 13px; cursor: pointer; }
    .msg .longbtn:hover { background: var(--secondary-container); }
    .msg .fold { display: none; font-size: 13px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg.collapsed .fold { display: block; }
    .msg.fav { border-color: var(--tertiary); }
    .mact { display: flex; gap: 2px; margin-top: 6px; margin-left: -8px; }
    /* 消息操作按钮：统一放在气泡右下角；气泡底部留空，避免遮挡正文 */
    .msg { position: relative; }
    .msg:has(.mact) { padding-bottom: 42px; min-width: 152px; }   /* 短气泡也至少能放下四个按钮，不穿透 */
    .msg .mact { position: absolute; bottom: 6px; right: 6px; margin: 0; padding: 2px; border-radius: 12px;
      background: color-mix(in srgb, var(--surface-container-lowest) 88%, transparent); backdrop-filter: blur(4px); }
    .msg.user .mact { background: color-mix(in srgb, var(--primary-container) 88%, transparent); }
    .mact .icon-btn { width: 32px; height: 32px; border-radius: 16px; }
    .mact .icon-btn.on { color: var(--tertiary); }
    .mact .icon-btn:disabled { opacity: .38; cursor: default; }
    .mact .icon-btn:disabled:hover { background: transparent; }

    /* 设置：常见回答 */
    .qr-list { display: flex; flex-direction: column; gap: 6px; }
    .qr-item { display: flex; gap: 4px; align-items: center; }
    .qr-item .input { height: 40px; }
    .qr-item .icon-btn:disabled { opacity: .38; cursor: default; }

    /* 设置 */
    .sec { padding: 12px 0; border-bottom: 1px solid var(--outline-variant); }
    .sec:last-child { border-bottom: 0; }
    .sec h3 { margin: 0 0 12px; font-size: 14px; font-weight: 500; color: var(--primary); }
    .row2 { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    .row2 label { flex: 1; min-width: 200px; }
    .lbl { font-size: 12px; color: var(--on-surface-variant); display: block; margin-bottom: 4px; }
    .input { height: 48px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 12px; background: transparent; width: 100%; outline: none; }
    .input:focus { border: 2px solid var(--primary); padding: 0 11px; }
    .seg { display: inline-flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; }
    .seg button { height: 40px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
    .seg button + button { border-left: 1px solid var(--outline); }
    .seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; }
    .switch-row .t { font-size: 14px; } .switch-row .d { font-size: 12px; color: var(--on-surface-variant); }
    .switch { width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-container-highest); position: relative; cursor: pointer; flex: none; padding: 0; }
    .switch::after { content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transition: all .15s; }
    .switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
    .switch[aria-checked="true"]::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--on-primary); }
    .switch:disabled { opacity: .38; cursor: default; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
    .kv .k { color: var(--on-surface-variant); }
    .clients { margin-top: 8px; font-size: 12px; color: var(--on-surface-variant); }

    /* 网站下拉 */
    .sitemenu { position: relative; }
    .menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); min-width: 260px; max-height: 70vh; overflow-y: auto; background: var(--surface-container); border-radius: 8px; box-shadow: var(--elev-2, var(--elev-3)); padding: 8px 0; z-index: 25; }
    .menu.open { display: block; }
    .mi { display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 12px; border: 0; background: transparent; color: var(--on-surface); cursor: pointer; text-align: left; font-size: 14px; }
    .mi:hover, .mi:focus-visible { background: var(--secondary-container); outline: none; }
    .mi .avatar { width: 28px; height: 28px; font-size: 12px; }
    .mi .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .mi .nm small { color: var(--on-surface-variant); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mi .del, .mi .ed, .mi .cfg { width: 32px; height: 32px; }

    .mi.add .plus { width: 28px; height: 28px; border-radius: 14px; border: 1px dashed var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
    .mi.restore .plus { width: 28px; height: 28px; border-radius: 14px; border: 1px dashed var(--outline); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
    .probe-st { font-size: 13px; color: var(--on-surface-variant); margin: 12px 0; }
    .probe-st.err { color: var(--error); }
    .probe-res { display: none; flex-direction: column; gap: 10px; }
    .probe-res.open { display: flex; }
    .probe-res .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 13px; }
    .probe-res .kv span:nth-child(odd) { color: var(--on-surface-variant); }
    .probe-res .smp { font-size: 12px; border: 1px solid var(--outline-variant); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    .probe-res .smp div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .probe-res .warn { font-size: 12px; color: var(--st-limit); }

    /* Snackbar */
    /* 右下角状态按钮：发送进度 / 提示（替代 snackbar） */
    #fabs { position: fixed; right: 24px; bottom: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; z-index: 40; pointer-events: none; }
    .fab-item { position: relative; display: flex; align-items: center; gap: 10px; pointer-events: auto; animation: fab-in .2s ease-out; transition: opacity .2s, transform .2s; }
    .fab-item.leaving { opacity: 0; transform: scale(.6); }
    @keyframes fab-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    .fab { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; cursor: default;
      background: var(--surface-container-high); color: var(--primary); box-shadow: var(--elev-3); transition: background .2s, color .2s; }
    .fab .ring { position: absolute; inset: 2px; width: 48px; height: 48px; transform: rotate(-90deg); }
    .fab .ring circle { fill: none; stroke-width: 3; }
    .fab .ring .track { stroke: var(--outline-variant, rgba(0,0,0,.12)); }
    .fab .ring .bar { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
    .fab-ic { display: grid; place-items: center; }
    .fab-ic .i { fill: currentColor; }
    .fab-item[data-state="pending"] .fab-ic { animation: fab-pulse 1.2s ease-in-out infinite; }
    @keyframes fab-pulse { 50% { opacity: .45; } }
    .fab-item[data-conv] .fab { cursor: pointer; }
    .sent-files { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
    .sent-file { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 10px; border-radius: 8px; background: var(--surface-container-high); color: var(--on-surface); font-size: 13px; }
    .sent-file .sf-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sent-file small { color: var(--on-surface-variant); flex: none; }
    .fab-item[data-state="ok"] .fab { background: var(--st-idle-bg); color: var(--st-idle); }
    .fab-item[data-state="ok"] .ring { opacity: 0; transition: opacity .3s .15s; }
    .fab-item[data-state="err"] .fab { background: var(--error-container); color: var(--on-error-container); cursor: pointer; }
    .fab-item[data-state="err"] .ring { display: none; }
    .fab-label { background: var(--inverse-surface); color: var(--inverse-on-surface); border-radius: 16px; padding: 6px 12px; font-size: 13px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: var(--elev-3); }
    .fab-item[data-state="err"] .fab-label { display: none; }
    .fab-panel { display: none; position: absolute; right: 0; bottom: 64px; width: min(340px, calc(100vw - 48px)); background: var(--surface-container-high); color: var(--on-surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--elev-3); }
    .fab-item.open .fab-panel { display: block; animation: fab-in .15s ease-out; }
    .fab-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fab-text { color: var(--error); font-size: 13px; }
    .fab-detail { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-container-highest); font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto; }
    .fab-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    @media (prefers-reduced-motion: reduce) { .fab-item, .fab-item[data-state="pending"] .fab-ic, .fab .ring .bar { animation: none; transition: none; } }
    .menu .mi.editing { flex-wrap: wrap; cursor: default; gap: 6px; height: auto; padding: 8px 12px; }
    .menu .mi.editing .input { height: 32px; flex: 1 1 100%; padding: 0 8px; }
    .menu .mi.editing .row { display: flex; gap: 6px; justify-content: flex-end; flex: 1 1 100%; }
    .mi.off .nm, .mi.off .avatar { opacity: .5; }
    .mi .off-tag { font-size: 11px; color: var(--on-surface-variant); border: 1px solid var(--outline-variant); border-radius: 6px; padding: 0 6px; }
    .cfg-fields { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0; }
    .cfg-fields .input { height: 36px; font: 12.5px ui-monospace, Consolas, monospace; }
    .cfg-json { font: 12px/1.5 ui-monospace, Consolas, monospace; min-height: 200px; white-space: pre; }
    .dialog .df .grow { flex: 1; }
</style>

    </button>
    <button id="launchBtn" class="icon-btn" title="一键启动：后台打开所有网站" aria-label="一键启动">
      <svg class="i" viewBox="0 0 24 24"><path d="M9.19 6.35c-2.04 2.29-3.44 5.58-3.57 5.89L2 10.69l4.05-4.05c.47-.47 1.15-.68 1.81-.55l1.33.26zM11.17 17s3.74-1.55 5.89-3.7c5.4-5.4 4.5-9.62 4.21-10.57-.95-.3-5.17-1.19-10.57 4.21C8.55 9.09 7 12.83 7 12.83L11.17 17zm6.48-2.19c-2.29 2.04-5.58 3.44-5.89 3.57L13.31 22l4.05-4.05c.47-.47.68-1.15.55-1.81l-.26-1.33zM9 18c0 .83-.34 1.58-.88 2.12C6.94 21.3 2 22 2 22s.7-4.94 1.88-6.12A3 3 0 0 1 9 18zm4-9c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z"/></svg>
    </button>
  </header>

  <div id="chips" class="chips"></div>
  <main><section id="grid" class="grid"></section></main>

  <!-- 底部群发：输入内容发送给所有空闲会话 -->
  <div id="bcastBar" class="bcastbar">
    <div class="bcastbox">
      <div id="bcastFiles" class="qfiles" aria-label="要群发的文件"></div>
      <textarea id="bcastText" rows="1" placeholder="群发到所有空闲会话…"></textarea>
      <button id="bcastAttach" class="icon-btn attach" type="button" title="添加附件"></button>
      <input id="bcastFile" type="file" hidden multiple />
      <button id="bcastSend" class="btn filled" type="button">群发</button>
    </div>
  </div>

  <!-- 群发结果：每个 AI 的回复拼在一起 -->
  <div id="bcastResultScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="bcastResultTitle">
    <div class="dialog">
      <div class="dh">
        <h2 id="bcastResultTitle">群发结果</h2>
        <button id="bcastResultClose" class="icon-btn" title="关闭">
          <svg class="i" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="dsub" id="bcastResultSub"></div>
      <div class="db"><div id="bcastResultList" class="bcast-results"></div></div>
    </div>
  </div>

  <!-- 详情 -->
  <div id="detailScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="dialog">
      <div class="dh">
        <h2 id="detailTitle">-</h2>
        <button id="detailPin" class="icon-btn" title="置顶" aria-pressed="false">
          <svg class="i" viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
        </button>
        <button id="detailJump" class="icon-btn" title="跳转到页面">
          <svg class="i" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        </button>
        <button id="detailClose" class="icon-btn" title="关闭">
          <svg class="i" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="detailSub" class="dsub"></div>
      <div id="detailBody" class="db"><div id="detailMsgs" class="msgs"></div></div>
      <div id="composer" class="composer">
        <div id="quickFiles" class="qfiles" aria-label="要发送的文件"></div>
        <div class="qrow">
          <div class="qwrap">
            <textarea id="quickText" class="field" placeholder="发到这个会话，Enter 发送，Shift+Enter 换行；点击常见回答直接发送"></textarea>
            <button id="quickAttach" class="icon-btn attach" type="button" hidden></button>
            <input id="quickFile" type="file" hidden />
          </div>
          <button id="quickSend" class="btn filled s">发送</button>
        </div>
        <div id="quickCands" class="cands" role="listbox"></div>
      </div>
    </div>
  </div>

  <!-- 转发：把一条用户消息的文本通过 reply 命令发到另一个 AI 的会话 -->
  <div id="forwardScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="forwardTitle">
    <div class="dialog narrow">
      <div class="dh">
        <h2 id="forwardTitle">转发到…</h2>
        <button id="forwardClose" class="icon-btn" title="关闭">
          <svg class="i" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="dsub" id="forwardSub"></div>
      <div class="db"><div id="forwardList" class="fwlist"></div></div>
    </div>
  </div>


  <!-- 添加网站：插件打开网址 → 抓取 DOM → 分析 → 确认添加 -->
  <div id="siteScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="siteTitle">
    <div class="dialog narrow">
      <div class="dh"><h2 id="siteTitle">添加网站</h2></div>
      <div class="db">
        <label><span class="lbl">会话网址（打开一段已有消息的对话，浏览器里需已登录）</span>
          <input id="siteUrl" class="input" type="url" placeholder="https://example.com/chat/xxxx" /></label>
        <div id="siteStatus" class="probe-st"></div>
        <div id="siteResult" class="probe-res">
          <div id="siteKv" class="kv"></div>
          <div id="siteSamples" class="smp"></div>
          <div id="siteWarn" class="warn"></div>
          <label><span class="lbl">显示名称</span><input id="siteName" class="input" maxlength="40" /></label>
        </div>
      </div>
      <div class="df">
        <button id="siteCancel" class="btn text">取消</button>
        <button id="siteProbe" class="btn tonal">获取 DOM</button>
        <button id="siteConfirm" class="btn filled" disabled>确认添加</button>
      </div>
    </div>
  </div>

  <!-- 网站配置：启用 / 停用、域名、DOM 配置（常用项 + 完整 JSON）、恢复默认 -->
  <div id="siteCfgScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="siteCfgTitle">
    <div class="dialog narrow">
      <div class="dh"><h2 id="siteCfgTitle">网站配置</h2></div>
      <div class="db">
        <div class="switch-row">
          <div><div class="t">启用</div><div class="d">停用后插件不再观察这个网站（已开的页面刷新后生效）</div></div>
          <button id="siteCfgEnabled" class="switch" role="switch" aria-checked="true" type="button"></button>
        </div>
        <label><span class="lbl">其他域名（逗号分隔；本域名及子域名都会匹配）</span>
          <input id="siteCfgHosts" class="input" placeholder="例如 chat.example.com, example.com" /></label>
        <div id="siteCfgFields" class="cfg-fields"></div>
        <label><span class="lbl">完整 DOM 配置（JSON）</span>
          <textarea id="siteCfgJson" class="field cfg-json" spellcheck="false" rows="12"></textarea></label>
        <div id="siteCfgErr" class="probe-st err"></div>
      </div>
      <div class="df">
        <button id="siteCfgReset" class="btn text" type="button">恢复默认</button>
        <span class="grow"></span>
        <button id="siteCfgCancel" class="btn text" type="button">取消</button>
        <button id="siteCfgSave" class="btn filled" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settingsScrim" class="scrim" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="dialog narrow">
      <div class="dh">
        <h2 id="settingsTitle">设置</h2>
        <button id="settingsClose" class="icon-btn" title="关闭">
          <svg class="i" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="db">
        <section class="sec">
          <h3>连接</h3>
          <label><span class="lbl">observer token（server/data/config.json）</span>
            <input id="token" class="input" type="password" autocomplete="off" /></label>
          <div class="row2">
            <button id="connect" class="btn filled">连接</button>
            <button id="disconnect" class="btn outlined">断开</button>
            <span id="connDetail" class="lbl" style="margin:0"></span>
          </div>
        </section>
        <section class="sec">
          <h3>通知</h3>
          <div class="switch-row">
            <div><div class="t">普通会话回答完成：音效</div><div class="d">播放一声提示音</div></div>
            <button class="switch" role="switch" data-notify="sound"></button>
          </div>
          <div class="switch-row">
            <div><div class="t">置顶会话回答完成：弹出详情</div><div class="d">直接打开这条回答所在会话的详情并定位到回答；看板在后台时另发系统通知（需启用下方系统通知），同时播放提示音</div></div>
            <button class="switch" role="switch" data-notify="pinned_popup"></button>
          </div>
          <div class="switch-row">
            <div><div class="t">所有会话回答完成：弹出详情</div><div class="d">不只置顶会话，任何会话回答完成都直接打开详情；正在看别的会话时排队，关掉当前详情后依次打开（音效按上面的设置）</div></div>
            <button class="switch" role="switch" data-notify="all_popup"></button>
          </div>
          <div class="switch-row">
            <div><div class="t">启用系统通知</div><div class="d" id="notifyPerm"></div></div>
            <button id="notifyEnabled" class="switch" role="switch" aria-checked="false"></button>
          </div>
          <div class="row2"><button id="soundTest" class="btn text">试听音效</button><button id="notifyTest" class="btn text">发送测试通知</button></div>
        </section>
        <section class="sec">
          <h3>常见回答</h3>
          <div class="d lbl">快速回复时弹出的候选，按顺序显示</div>
          <div id="qrList" class="qr-list"></div>
          <div class="row2">
            <label style="flex:1"><input id="qrNew" class="input" placeholder="新增一条常见回答" maxlength="2000" /></label>
            <button id="qrAdd" class="btn tonal">添加</button>
          </div>
          <div class="row2"><button id="qrReset" class="btn text">恢复默认</button></div>
        </section>
        <section class="sec">
          <h3>后台</h3>
          <div id="serverInfo" class="kv"><span class="k">状态</span><span>-</span></div>
          <div id="serverClients" class="clients"></div>
          <div class="row2"><button id="serverRefresh" class="btn text">刷新</button><button id="resetDb" class="btn text danger" title="清空所有会话、消息、收藏、置顶和归档记录">重置数据库</button></div>
        </section>
      </div>
    </div>
  </div>

  <div id="fabs" aria-live="polite"></div>
  <script type="module" src="/dashboard/app.js"></script>
</body>
</html>
