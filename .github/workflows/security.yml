name: Security

"on":
  push:
    branches: [main, hark]
  pull_request: {}
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      # 直接用 gitleaks CLI：不需要 GITHUB_TOKEN / license，也避开 gitleaks-action 的 Node 20 运行时
      - name: Secret scan
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
