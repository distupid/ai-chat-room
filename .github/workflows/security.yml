name: Security

"on":
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
