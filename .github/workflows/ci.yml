name: CI

"on":
  push:
    branches: [main, hark]
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # eslint / tsc 尚未配置（见 AGENTS.md「待确认」），配置后再加回
      - run: pnpm test
      - name: 生成物与源码一致
        run: git diff --exit-code -- contracts/protocol.schema.json src/frontend/shared/
